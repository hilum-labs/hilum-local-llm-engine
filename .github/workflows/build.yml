name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.cu'
      - '**/*.cuh'
      - '**/*.m'
      - '**/*.metal'
      - '**/*.comp'
      - '**/*.glsl'
      - '**/*.wgsl'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/build.yml'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '**/*.cpp'
      - '**/*.cu'
      - '**/*.cuh'
      - '**/*.m'
      - '**/*.metal'
      - '**/*.comp'
      - '**/*.glsl'
      - '**/*.wgsl'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hilum:
    name: Hilum (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DHILUM_BUILD_LIB=ON
          -DLLAMA_BUILD_TESTS=ON
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DGGML_VULKAN=OFF
          -DGGML_METAL=OFF

      - name: Build
        run: cmake --build build --config Release --target hilum test-hilum-api test-hilum-runtime --parallel 4

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure -L hilum --timeout 1800

  sanitizers:
    name: Hilum sanitizers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        env:
          CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=address,undefined
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DHILUM_BUILD_LIB=ON
          -DLLAMA_BUILD_TESTS=ON
          -DLLAMA_BUILD_EXAMPLES=OFF
          -DLLAMA_BUILD_TOOLS=OFF
          -DLLAMA_BUILD_SERVER=OFF
          -DGGML_VULKAN=OFF
          -DGGML_METAL=OFF
          -DGGML_OPENMP=OFF

      - name: Build
        run: cmake --build build-sanitized --target test-hilum-api test-hilum-runtime --parallel 4

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure -L hilum --timeout 1800
